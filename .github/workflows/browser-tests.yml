name: Browser startup tests

on:
  push:
    paths:
      - nodeseek_daily.py
      - requirements.txt
      - tests/**
      - .github/workflows/browser-tests.yml
  pull_request:
    paths:
      - nodeseek_daily.py
      - requirements.txt
      - tests/**
      - .github/workflows/browser-tests.yml

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      # Uses the hosted runner's Chrome. No secrets or NodeSeek requests.
      - name: Verify browser startup only
        run: python -m unittest discover -s tests -p 'smoke_browser_startup.py' -v
